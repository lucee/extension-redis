name: Java CI

on:
  push:
    branches: ['4.1']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish (a new build number) to Maven Central'
        type: boolean
        default: false
      qualifier:
        description: 'Qualifier for this run. "pom" keeps extension.version.qualifier from pom.xml (-SNAPSHOT); pick RC, BETA, ALPHA or release (none) to publish a release candidate or final release from the current code'
        type: choice
        options: [pom, SNAPSHOT, ALPHA, BETA, RC, release]
        default: pom
      luceeVersions:
        description: 'JSON array of Lucee versions to test'
        required: false
        default: '[ "6.2/snapshot/light", "7.0/snapshot/light", "7.1/snapshot/light" ]'

# Run builds of the same ref one after another, so every push to 4.1 resolves its own
# revision (highest build + 1) only after the previous build has published and created its tag.
# PRs have their own ref (refs/pull/N/merge), so they are not blocked by branch builds.
# queue: max keeps up to 100 pending runs (default would keep only one and cancel older pending runs).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # like Lucee core (LDEV-6516): every push to 4.1 publishes a new build, a manual run publishes when deploy is ticked.
      # PRs never publish. Runs without the deploy secrets (forks) only build and test, see "Resolve next revision".
      DO_DEPLOY: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && github.ref == 'refs/heads/4.1') }}
      QUALIFIER_INPUT: ${{ inputs.qualifier || 'pom' }}
    outputs:
      version: ${{ steps.extract-version.outputs.VERSION }}
      tag: ${{ steps.extract-version.outputs.TAG }}
      deploy: ${{ steps.extract-version.outputs.DEPLOY }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      # ubuntu-latest moved to Maven 3.10.0 (runner image 20261004). With it, central-publishing-maven-plugin
      # leaves maven-metadata-local.xml in the staging dir, which Central rejects. Pin Maven 3.9.x like Lucee core.
      - name: Set up Maven 3.9.16
        run: |
          MVN_VERSION=3.9.16
          MVN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$MVN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> $GITHUB_PATH
          "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin/mvn" -v

      - name: Resolve next revision
        run: |
          set -euo pipefail
          # Only builds that publish allocate a build number: every push to 4.1 and manual runs with deploy ticked.
          # PRs and runs without the deploy secrets (forks) keep the default POM revision (base.0 + qualifier) and publish nothing.
          if [ "$DO_DEPLOY" != "true" ]; then
            echo "Skipping revision bump (not a push to 4.1 / manual deploy)"
            exit 0
          fi
          # without deploy credentials nothing gets published, so do not consume a build number
          if [ "${{ secrets.GPG_PASSPHRASE }}" == "" ] || [ "${{ secrets.MAVEN_USERNAME }}" == "" ]; then
            echo "Skipping revision bump (no GPG / Maven deploy credentials; test-only run)"
            exit 0
          fi

          BASE=$(mvn help:evaluate -Dexpression=extension.version.base -q -DforceStdout | tr -d '\r')
          QUALIFIER=$(mvn help:evaluate -Dexpression=extension.version.qualifier -q -DforceStdout | tr -d '\r')
          # an empty property evaluates to "null"
          [ "$QUALIFIER" == "null" ] && QUALIFIER=""
          # a manual run can publish the current code as ALPHA, BETA, RC or final release instead of the pom qualifier
          case "$QUALIFIER_INPUT" in
            pom|"") ;;
            release) QUALIFIER="" ;;
            SNAPSHOT|ALPHA|BETA|RC) QUALIFIER="-$QUALIFIER_INPUT" ;;
            *) echo "::error::unknown qualifier input [$QUALIFIER_INPUT]"; exit 1 ;;
          esac
          echo "Base=$BASE qualifier=$QUALIFIER"
          BASE_RE=$(printf '%s' "$BASE" | sed 's/\./\\./g')

          git fetch --tags --force origin 2>/dev/null || true

          # highest build of this base, from git tags (base.N), Maven Central and the Central snapshot repository (base.N[-QUALIFIER]).
          # Both are checked, so a version published without a tag (e.g. 4.1.0.1-RC) is never built twice.
          BUILDS=$(git tag -l "${BASE}.*" | sed -nE "s/^${BASE_RE}\.([0-9]+)$/\1/p" || true)
          for url in \
            "https://repo1.maven.org/maven2/org/lucee/redis-extension/maven-metadata.xml" \
            "https://repo1.maven.org/maven2/org/lucee/redis/maven-metadata.xml" \
            "https://central.sonatype.com/repository/maven-snapshots/org/lucee/redis-extension/maven-metadata.xml" \
            "https://central.sonatype.com/repository/maven-snapshots/org/lucee/redis/maven-metadata.xml"
          do
            META=$(curl -fsSL --max-time 30 "$url" 2>/dev/null || true)
            BUILDS="$BUILDS"$'\n'$(printf '%s' "$META" | grep -oE "<version>${BASE_RE}\.[0-9]+([-.][^<]*)?</version>" | sed -E "s#<version>${BASE_RE}\.([0-9]+).*#\1#" || true)
          done
          MAX_BUILD=$(printf '%s\n' "$BUILDS" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)

          if [ -z "$MAX_BUILD" ]; then
            NEXT_BUILD=0
          else
            NEXT_BUILD=$((MAX_BUILD + 1))
          fi

          VERSION="${BASE}.${NEXT_BUILD}${QUALIFIER}"
          # tag shape matches existing tags (4.1.0.0, 3.0.0.54): numeric 4-part without qualifier
          TAG="${BASE}.${NEXT_BUILD}"
          echo "Resolved VERSION=$VERSION TAG=$TAG (max seen build=${MAX_BUILD:-none})"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DEPLOY=true" >> "$GITHUB_ENV"

      - name: Extract version number
        id: extract-version
        run: |
          set -euo pipefail
          if [ -z "${VERSION:-}" ]; then
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '\r')
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){3}(-[A-Za-z0-9]+)*$'; then
            echo "::error::[$VERSION] is not a valid extension version"; exit 1
          fi
          echo "Using VERSION=$VERSION TAG=${TAG:-}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=${TAG:-}" >> $GITHUB_OUTPUT
          echo "DEPLOY=${DEPLOY:-false}" >> $GITHUB_OUTPUT

      - name: Build extension
        env:
          VERSION: ${{ steps.extract-version.outputs.VERSION }}
        run: mvn -B -e clean package -Drevision="$VERSION"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: redis-lex
          path: target/*.lex

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    strategy:
      fail-fast: false
      matrix:
        lucee: ${{ fromJSON(inputs.luceeVersions || '["6.2/snapshot/light", "7.0/snapshot/light", "7.1/snapshot/light"]') }}
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      minio:
        image: fclairamb/minio-github-actions
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v6

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Cache Lucee files
        uses: actions/cache@v5
        with:
          path: ~/work/_actions/lucee/script-runner/main/lucee-download-cache
          key: lucee-downloads

      - name: Download extension artifact
        uses: actions/download-artifact@v8
        with:
          name: redis-lex
          path: target

      - name: Checkout Lucee
        uses: actions/checkout@v6
        with:
          repository: lucee/lucee
          path: lucee

      - name: Start Redis listening on a Unix domain socket (LDEV-6541)
        run: |
          mkdir -p /tmp/redis-socket && chmod 777 /tmp/redis-socket
          docker run -d --name redis-socket -v /tmp/redis-socket:/tmp/redis-socket redis \
            redis-server --port 0 --save '' \
            --unixsocket /tmp/redis-socket/redis.sock --unixsocketperm 777 \
            --user default off --user lucee on '>lucee-socket-test' '~*' '&*' '+@all'
          for i in $(seq 1 30); do
            [ -S /tmp/redis-socket/redis.sock ] && break
            sleep 1
          done
          ls -la /tmp/redis-socket
          docker exec redis-socket redis-cli -s /tmp/redis-socket/redis.sock --user lucee --pass lucee-socket-test --no-auth-warning ping

      - name: Run Lucee Test Suite
        uses: lucee/script-runner@main
        with:
          webroot: ${{ github.workspace }}/lucee/test
          execute: /bootstrap-tests.cfm
          luceeVersion: ${{ matrix.lucee }}
          extensionDir: ${{ github.workspace }}/target
        env:
          testLabels: redis
          testAdditional: ${{ github.workspace }}/tests
          REDIS_PORT: 6379
          REDIS_SERVER: localhost
          REDIS_SOCKET: /tmp/redis-socket/redis.sock
          REDIS_SOCKET_USERNAME: lucee
          REDIS_SOCKET_PASSWORD: lucee-socket-test

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test]
    # set by the build job: push to the release branch or manual deploy, with the deploy secrets available
    if: needs.build.outputs.deploy == 'true'
    permissions:
      # push the tag of the published revision
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      # ubuntu-latest moved to Maven 3.10.0 (runner image 20261004). With it, central-publishing-maven-plugin
      # leaves maven-metadata-local.xml in the staging dir, which Central rejects. Pin Maven 3.9.x like Lucee core.
      - name: Set up Maven 3.9.16
        run: |
          MVN_VERSION=3.9.16
          MVN_SHA512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          curl -fsSL -o "$RUNNER_TEMP/maven.tar.gz" "https://repo1.maven.org/maven2/org/apache/maven/apache-maven/$MVN_VERSION/apache-maven-$MVN_VERSION-bin.tar.gz"
          echo "$MVN_SHA512  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin" >> $GITHUB_PATH
          "$RUNNER_TEMP/apache-maven-$MVN_VERSION/bin/mvn" -v

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}
          restore-keys: maven-

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Build and Deploy with Maven
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          # central-publishing-maven-plugin sends a -SNAPSHOT version to the Central snapshot repository
          # (https://central.sonatype.com/repository/maven-snapshots/), any other qualifier (-ALPHA, -BETA, -RC or none) to Maven Central.
          # Everything is signed, snapshots included (same as the snapshots published before).
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "------- Maven Deploy snapshot $VERSION -------";
            mvn -B -e clean deploy -DperformRelease=true -Drevision="$VERSION" --settings maven-settings.xml
          else
            echo "------- Maven Deploy release $VERSION -------";
            mvn -B -e clean deploy -DperformRelease=true -Drevision="$VERSION" --settings maven-settings.xml
          fi

      - name: Tag published revision
        if: success() && needs.build.outputs.tag != ''
        env:
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin 2>/dev/null || true
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping"
            exit 0
          fi
          echo "Creating annotated tag $TAG for $VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$VERSION"
          git push origin "refs/tags/$TAG"
